name: nxnative IPA Builder (Xcode 27)

# Shown in the run list. It is fixed when the run starts, so it can only use inputs: type the game's title in game_name
# (falls back to the game_target file name when that is left empty).
run-name: ${{ inputs.game_name || inputs.game_target }} IPA Build

on:
  workflow_dispatch:
    inputs:
      game_target:
        description: 'On the tunnel: an archive or game file name, or a folder name (ending in / or with no extension). Ignored for Google Drive URLs'
        required: true
        default: 'PaperMario.7z'
      game_name:
        description: 'Game title for the run name, e.g. Kingdom Hearts Melody Of Memory (optional)'
        required: false
        default: ''
      tunnel_url:
        description: 'Google Drive share/download URL, or the tunnel base URL'
        required: true
        default: 'https://drive.google.com/uc?export=download&confirm=t&id=1_O5NFIohfWaU8X7LvbKjodeKJNauII0c'
      device_type:
        description: 'Target device / architecture'
        required: true
        default: 'iphone14pro_a16'
        type: choice
        options:
          - iphone15_plus      # iPhone 15 Pro+, iPads, Macs: project defaults (-mcpu=apple-a18)
          - iphone14pro_a16    # iPhone 14 Pro / A16: -mcpu=apple-a16 (main has no BC fallback: Vulkan/OpenGL games need BC textures)
      romfs:
        description: 'Game files: bundle = inside the IPA; separate = small IPA plus a RomFS.img artifact you copy to the phone (--romfs)'
        required: true
        default: 'bundle'
        type: choice
        options:
          - bundle
          - separate
      allow_other_metal:
        description: 'Pass --allow-other-metal (only if the Metal compiler check stops the build)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: false

env:
  # The toolchain the repo supports (README: Xcode 27.2; dm/gfx/tools/dmsh_chain.lock holds its Metal compiler), named by path
  # exactly as tests.yml does, so a new default Xcode on the image cannot change the build.
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  WORK_DIR: Games/PreparedGame

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build IPA (${{ inputs.device_type }})
    runs-on: xcode-27
    timeout-minutes: 345   # first build of a big game: Odyssey took 2h18m for shaders alone on this runner size

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the selected Xcode's Metal toolchain
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain   # a separate component, not included in the xcode-27 image
          xcrun --sdk iphoneos --show-sdk-version >/dev/null 2>&1 || xcodebuild -downloadPlatform iOS
          xcodebuild -version
          xcrun metal --version

      - name: Check the Metal compiler against dmsh_chain.lock
        if: ${{ !inputs.allow_other_metal }}
        run: python3 dm/gfx/tools/own_compilers.py --check-metal   # stops here, early, with the reason, instead of after the download

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'   # the NSP script and the shader translator need the .NET 10 runtime

      - name: Install tools and Python packages
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          set -euo pipefail
          brew install xcodegen zstd glslang p7zip aria2
          python3 -m pip install --upgrade pip
          python3 -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic gdown \
            "backports.zstd; python_version < '3.14'"

      - name: Restore prod.keys
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.switch"
          printf '%s\n' "$PROD_KEYS" > "$HOME/.switch/prod.keys"
          chmod 600 "$HOME/.switch/prod.keys"
          test -s "$HOME/.switch/prod.keys" || { echo "::error::PROD_KEYS secret is empty"; exit 1; }

      - name: Work out the cache key for this game
        id: gamekey
        env:
          GAME_TARGET: ${{ inputs.game_target }}
          TUNNEL_URL: ${{ inputs.tunnel_url }}
        run: |
          set -euo pipefail
          h=$(printf '%s|%s' "$GAME_TARGET" "$TUNNEL_URL" | shasum -a 256 | cut -c1-16)
          echo "key=$h" >> "$GITHUB_OUTPUT"

      - name: Restore downloaded game files
        id: cache-game
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK_DIR }}
          key: game-v1-${{ steps.gamekey.outputs.key }}

      - name: Download and extract the game
        if: steps.cache-game.outputs.cache-hit != 'true'
        env:
          GAME_TARGET: ${{ inputs.game_target }}
          TUNNEL_URL: ${{ inputs.tunnel_url }}
        run: |
          set -euo pipefail
          rm -rf "$WORK_DIR"; mkdir -p "$WORK_DIR"
          ARCHIVE="$WORK_DIR/game_download.archive"
          TARGET="${GAME_TARGET%/}"
          ENCODED=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$TARGET")

          if [[ "$TUNNEL_URL" == *drive.google.com* ]]; then
            MODE=archive
            echo "Downloading from Google Drive with gdown"
            gdown --fuzzy "$TUNNEL_URL" -O "$ARCHIVE"
          elif [[ "$GAME_TARGET" == */ || ! "$TARGET" =~ \.(7z|zip|rar|tar|gz|xz|zst|nsp|nsz|xci|xcz)$ ]]; then
            MODE=directory
            echo "Downloading the folder '$TARGET' from the tunnel's directory listing"
            LIST="$RUNNER_TEMP/aria2-list.txt"
            python3 - "${TUNNEL_URL%/}/$ENCODED/" "$WORK_DIR" "$LIST" <<'PY'
          import html.parser, sys, urllib.parse, urllib.request
          base, work, out = sys.argv[1:4]
          root = urllib.parse.urlsplit(base)
          class Links(html.parser.HTMLParser):
              def __init__(self): super().__init__(); self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'a': self.hrefs += [v for k, v in attrs if k == 'href' and v]
          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'nxnative-ci'})
              with urllib.request.urlopen(req, timeout=60) as r: return r.read().decode('utf-8', 'replace')
          files, seen = [], set()
          def walk(url, depth):
              if url in seen or depth > 5: return
              seen.add(url)
              cur = urllib.parse.urlsplit(url).path
              page = fetch(url)
              parser = Links(); parser.feed(page)
              if depth == 0 and not parser.hrefs:
                  sys.exit('::error::No links in the directory listing at ' + url + ' (it may not be a plain index page). Start of the page: ' + page[:300].replace('\n', ' '))
              for h in parser.hrefs:
                  if h.startswith(('?', '#', 'mailto:', 'javascript:')): continue
                  full = urllib.parse.urljoin(url, h)
                  sp = urllib.parse.urlsplit(full)
                  if sp.netloc != root.netloc or not sp.path.startswith(cur) or sp.path == cur: continue   # parent / sort links
                  if sp.path.endswith('/'): walk(full.split('?')[0].split('#')[0], depth + 1)
                  else: files.append((full.split('?')[0], urllib.parse.unquote(sp.path[len(root.path):])))
          walk(base, 0)
          files = sorted(set(files))
          if not files: sys.exit('::error::The directory listing at ' + base + ' has no files')
          with open(out, 'w') as f:
              for u, rel in files: f.write(f'{u}\n  dir={work}\n  out={rel}\n')
          print(f'{len(files)} file(s):'); [print(' ', rel) for _, rel in files[:40]]
          PY
            aria2c -c -x16 -s16 -j4 --min-split-size=1M --auto-file-renaming=false --allow-overwrite=true -i "$LIST"
          elif [[ "$TARGET" =~ \.(nsp|nsz|xci|xcz)$ ]]; then
            MODE=file
            echo "Downloading the game file with aria2"
            aria2c -c -x16 -s16 --min-split-size=1M "${TUNNEL_URL%/}/$ENCODED" -d "$WORK_DIR" -o "$(basename "$TARGET")"
          else
            MODE=archive
            echo "Downloading the archive with aria2"
            aria2c -c -x16 -s16 --min-split-size=1M "${TUNNEL_URL%/}/$ENCODED" -d "$WORK_DIR" -o game_download.archive
          fi

          if [ "$MODE" = archive ]; then
            # An HTML page saved as the archive means a bad link or a Drive quota page
            if file "$ARCHIVE" | grep -qi 'html'; then
              echo "::error::The download is an HTML page, not an archive (bad link, or Google Drive quota)"
              exit 1
            fi
            echo "Extracting"
            7z x "$ARCHIVE" -o"$WORK_DIR/" -y || unzip -q "$ARCHIVE" -d "$WORK_DIR/"
            rm -f "$ARCHIVE"
          fi

          # Game files nested in a folder go up to the top level (a dump with base/ is left as it is)
          if [ ! -d "$WORK_DIR/base" ]; then
            find "$WORK_DIR" -mindepth 2 -type f \
              \( -name '*.nsp' -o -name '*.nsz' -o -name '*.xci' -o -name '*.xcz' \) \
              -exec mv {} "$WORK_DIR/" \;
          fi

          ls -la "$WORK_DIR"
          if ! ls "$WORK_DIR" | grep -Eqi '\.(nsp|nsz|xci|xcz)$' && [ ! -d "$WORK_DIR/base" ]; then
            echo "::error::No game files (.nsp/.nsz/.xci/.xcz, or a dump with base/) found"
            exit 1
          fi

      - name: Save downloaded game files
        if: steps.cache-game.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WORK_DIR }}
          key: game-v1-${{ steps.gamekey.outputs.key }}

      - name: Restore compiled shaders
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK_DIR }}/*_build/shader
          key: shader-${{ steps.gamekey.outputs.key }}-${{ github.run_id }}
          restore-keys: shader-${{ steps.gamekey.outputs.key }}-

      - name: Target the iPhone 14 Pro (A16)
        if: inputs.device_type == 'iphone14pro_a16'
        run: |
          set -euo pipefail
          # project.yml is where the host's CPU flag lives (build_ipa.sh copies it and runs xcodegen); compile_check.py mirrors it.
          # A plain `sed` over *.swift/*.m/*.pbxproj never reached project.yml, so the app was still built for apple-a18.
          for f in dm/ios/project.yml dm/ios/tools/compile_check.py; do
            grep -q 'apple-a18' "$f" || { echo "::error::apple-a18 not found in $f; the repo changed, update this step"; exit 1; }
            sed -i '' 's/apple-a18/apple-a16/g' "$f"
          done
          grep -n 'mcpu' dm/ios/project.yml dm/ios/tools/compile_check.py
          if grep -n 'apple-a18' dm/ios/project.yml dm/ios/tools/compile_check.py; then
            echo "::error::apple-a18 is still present after patching"; exit 1
          fi

      - name: Build the IPA
        env:
          ALLOW_OTHER_METAL: ${{ inputs.allow_other_metal }}
          ROMFS_MODE: ${{ inputs.romfs }}
        run: |
          set -euo pipefail
          extra=""
          if [ "$ALLOW_OTHER_METAL" = "true" ]; then extra="--allow-other-metal"; fi
          python3 scripts/build_ipa_from_nsp.py "$WORK_DIR" \
            -k "$HOME/.switch/prod.keys" --progress lines --romfs "$ROMFS_MODE" $extra

      - name: Save compiled shaders
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WORK_DIR }}/*_build/shader
          key: shader-${{ steps.gamekey.outputs.key }}-${{ github.run_id }}

      - name: Remove prod.keys
        if: always()
        run: rm -f "$HOME/.switch/prod.keys"

      - name: Name the artifacts after the game
        id: game
        if: always()
        env:
          GAME_TARGET: ${{ inputs.game_target }}
        run: |
          # The build script names the IPA after the game (SuperMarioOdyssey.ipa); a failed build falls back to the game file's name
          ipa=$(ls "$WORK_DIR"/*.ipa 2>/dev/null | head -n1 || true)
          if [ -n "$ipa" ]; then name=$(basename "$ipa" .ipa); else name="${GAME_TARGET%.*}"; fi
          name=$(printf '%s' "$name" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-\{2,\}/-/g; s/^-//; s/-$//')
          echo "game=${name:-nxnative}" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### ${{ steps.game.outputs.game }} (${{ inputs.device_type }}, RomFS ${{ inputs.romfs }})"
            ls -lh "$WORK_DIR"/*.ipa 2>/dev/null | awk '{print "- `" $NF "` (" $5 ")"}' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.game.outputs.game }}-${{ inputs.device_type }}-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0   # an IPA is already a zip
          # One exact folder, no `**`: the action then lists only that folder. `Games/**/*.ipa` walked the whole tree (the staged IPA contents and the
          # extracted game, 150,000+ files for Kingdom Hearts) and crashed with "Maximum call stack size exceeded" before uploading anything.
          path: ${{ env.WORK_DIR }}/*.ipa

      - name: Upload RomFS image (separate mode)
        if: inputs.romfs == 'separate'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.game.outputs.game }}-romfs-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0   # the image is large; copy it to the phone as Documents/romfs.img (the app refuses an image of another game version)
          path: |
            ${{ env.WORK_DIR }}/*_build/extract/*/RomFS.img
            ${{ env.WORK_DIR }}/*_build/aoc/*

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ steps.game.outputs.game }}-${{ inputs.device_type }}-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: ignore
          path: ${{ env.WORK_DIR }}/*_build/logs
