name: Build nxnative IPA from Cloud Storage

on:
  workflow_dispatch:
    inputs:
      game_name:
        description: 'Folder/Game name to output'
        required: true
        default: 'MarioWonder'
      gdrive_file_id:
        description: 'Google Drive File ID or Share URL of the zipped game/NSP'
        required: true

jobs:
  build:
    runs-on: macos-14 # Apple Silicon runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies via Homebrew
        run: |
          brew install xcodegen zstd glslang
          brew install --cask dotnet-sdk

      - name: Install Python Dependencies & nsz
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install lz4 capstone fonttools nsz gdown "backports.zstd; python_version < '3.14'"

      - name: Download Xcode Metal Toolchain Component
        run: |
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Restore prod.keys from GitHub Secrets
        run: |
          mkdir -p ~/.switch
          echo "${{ secrets.PROD_KEYS }}" > ~/.switch/prod.keys

      - name: Download Game Files from Google Drive
        run: |
          mkdir -p Games/${{ github.event.inputs.game_name }}
          # Using gdown to download from Google Drive (handles sharing links or file IDs)
          gdown --fuzzy "${{ github.event.inputs.gdrive_file_id }}" -O game_download.archive
          
          # If it's a zip or compressed archive, extract it into the game folder; 
          # otherwise, move the .nsp/.nsz file directly into place.
          if file game_download.archive | grep -qE "Zip|compressed|tar"; then
            unzip -q game_download.archive -d Games/${{ github.event.inputs.game_name }}/
          else
            mv game_download.archive Games/${{ github.event.inputs.game_name }}/game.nsp
          fi

      - name: Run Build Script
        run: |
          python3 scripts/build_ipa_from_nsp.py Games/${{ github.event.inputs.game_name }} -k ~/.switch/prod.keys

      - name: Upload Generated IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-nxnative-ipa
          path: |
            Games/**/*.ipa
