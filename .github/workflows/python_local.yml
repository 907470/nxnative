name: Build nxnative Self Hosted IPA

on:
  workflow_dispatch:
    inputs:
      game_name:
        description: 'Folder or filename in your RomM directory (e.g. PaperMario)'
        required: true
        default: 'PaperMario'
      tunnel_url:
        description: 'Active Cloudflare Tunnel Root URL (e.g. https://xxxx.trycloudflare.com)'
        required: true
      device_type:
        description: 'Target Device / Architecture'
        required: true
        default: 'iphone15_plus'
        type: choice
        options:
          - iphone15_plus      # iPhone 15 Pro+, iPads, Macs (Official repo)
          - iphone14pro_a16    # iPhone 14 Pro / A16 Bionic (Compatibility fork with BC-to-ASTC)

jobs:
  build:
    runs-on: macos-15 # Uses the latest available macOS Apple Silicon runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.device_type == 'iphone14pro_a16' && 'mianmuhammadse/nxnative' || 'seedds/nxnative' }}
          ref: ${{ github.event.inputs.device_type == 'iphone14pro_a16' && 'no-bc' || 'main' }}
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies via Homebrew
        run: |
          brew install xcodegen zstd glslang p7zip wget
          brew install --cask dotnet-sdk

      - name: Install Python Dependencies & nsz
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install lz4 capstone fonttools nsz "backports.zstd; python_version < '3.14'"

      - name: Download Xcode Metal Toolchain Component
        run: |
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Restore prod.keys from GitHub Secrets
        run: |
          mkdir -p ~/.switch
          echo "${{ secrets.PROD_KEYS }}" > ~/.switch/prod.keys
          echo "Checking prod.keys setup:"
          ls -la ~/.switch/prod.keys

      - name: Download Game Files from Local Server Tunnel
        run: |
          GAME_DIR="Games/${{ github.event.inputs.game_name }}"
          mkdir -p "$GAME_DIR"
          
          # Clean up any trailing slash from the input tunnel URL automatically
          CLEAN_TUNNEL_URL="${{ github.event.inputs.tunnel_url }}"
          CLEAN_TUNNEL_URL="${CLEAN_TUNNEL_URL%/}"
          
          # Check if the input points to a file archive (.7z, .zip) or a directory
          TARGET_INPUT="${{ github.event.inputs.game_name }}"
          
          if [[ "$TARGET_INPUT" == *.7z ]] || [[ "$TARGET_INPUT" == *.zip ]] || [[ "$TARGET_INPUT" == *.rar ]]; then
            # Single file download via curl
            FILE_URL="$CLEAN_TUNNEL_URL/$TARGET_INPUT"
            echo "Fetching file from local server: $FILE_URL"
            curl -L "$FILE_URL" -o "$GAME_DIR/game_download.archive"
            
            FILE_TYPE=$(file --mime-type -b "$GAME_DIR/game_download.archive")
            echo "Detected file mime-type: $FILE_TYPE"
            
            if echo "$FILE_TYPE" | grep -qE "zip|compressed|tar|octet-stream"; then
              unzip -q "$GAME_DIR/game_download.archive" -d "$GAME_DIR/" 2>/dev/null || true
              if [ -f "$GAME_DIR/game_download.archive" ]; then
                7z x "$GAME_DIR/game_download.archive" -o"$GAME_DIR/" 2>/dev/null && rm -f "$GAME_DIR/game_download.archive" || true
              fi
            fi
            
            if [ -z "$(find "$GAME_DIR" -name '*.nsp' -o -name '*.nsz' -o -name '*.xci')" ]; then
              mv "$GAME_DIR/game_download.archive" "$GAME_DIR/game.xci" 2>/dev/null || true
            fi
          else
            # Recursive folder download via wget
            FOLDER_URL="$CLEAN_TUNNEL_URL/$TARGET_INPUT/"
            echo "Recursively downloading folder from local server: $FOLDER_URL"
            
            wget -r -np -nH --cut-dirs=1 --reject "index.html*" -P "$GAME_DIR" "$FOLDER_URL"
            
            # Clean up stray index files
            find "$GAME_DIR" -name "index.html*" -delete
          fi
          
          # Flatten nested folder structures so all files sit directly in the game directory
          find "$GAME_DIR" -mindepth 2 -type f \( -name "*.nsp" -o -name "*.nsz" -o -name "*.xci" \) -exec mv {} "$GAME_DIR/" \;
          
          echo "=== Final contents of $GAME_DIR ==="
          ls -la "$GAME_DIR"

      - name: Run Build Script
        run: |
          python3 scripts/build_ipa_from_nsp.py Games/${{ github.event.inputs.game_name }} -k ~/.switch/prod.keys

      - name: Upload Generated Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-nxnative-output
          retention-days: 7
          path: |
            Games/**/*.ipa
            Games/**/*.json
            Games/**/*.zip
