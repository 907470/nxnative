name: Build nxnative IPA from self host v.3?

on:
  workflow_dispatch:
    inputs:
      game_target:
        description: 'Exact filename or folder in RomM (e.g. Paper Mario.7z or MarioKart)'
        required: true
        default: 'SMO.7z'
      tunnel_url:
        description: 'Active Cloudflare Tunnel Root URL (e.g. https://xxxx.trycloudflare.com)'
        required: true
      device_type:
        description: 'Target Device / Architecture'
        required: true
        default: 'iphone14pro_a16'
        type: choice
        options:
          - iphone15_plus      # iPhone 15 Pro+, iPads, Macs (Official repo)
          - iphone14pro_a16    # iPhone 14 Pro / A16 Bionic (Compatibility fork with BC-to-ASTC)

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.device_type == 'iphone14pro_a16' && 'mianmuhammadse/nxnative' || 'seedds/nxnative' }}
          ref: ${{ github.event.inputs.device_type == 'iphone14pro_a16' && 'no-bc' || 'main' }}
          submodules: recursive

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Verify or Download Metal Toolchain Component
        run: |
          if ! xcrun -find metal >/dev/null 2>&1; then
            echo "Metal toolchain not found in active Xcode path. Downloading component..."
            sudo xcodebuild -downloadComponent MetalToolchain || true
          else
            echo "Metal toolchain is present and configured."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies via Homebrew
        run: |
          brew install xcodegen zstd glslang p7zip wget spirv-cross aria2
          brew install --cask dotnet-sdk

      - name: Install Python Dependencies & nsz
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install lz4 capstone fonttools nsz "backports.zstd; python_version < '3.14'"

      - name: Restore prod.keys from GitHub Secrets
        run: |
          mkdir -p ~/.switch
          echo "${{ secrets.PROD_KEYS }}" > ~/.switch/prod.keys
          echo "Checking prod.keys setup:"
          ls -la ~/.switch/prod.keys

      - name: Download and Prepare Game Files
        run: |
          RAW_TARGET="${{ github.event.inputs.game_target }}"
          CLEAN_TUNNEL_URL="${{ github.event.inputs.tunnel_url }}"
          CLEAN_TUNNEL_URL="${CLEAN_TUNNEL_URL%/}"
          
          # Automatically URL-encode the filename/target so spaces become %20 safely
          ENCODED_TARGET=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$RAW_TARGET")
          
          # Determine target build directory (strip extension if it's an archive)
          if [[ "$RAW_TARGET" == *.7z ]] || [[ "$RAW_TARGET" == *.zip ]] || [[ "$RAW_TARGET" == *.rar ]]; then
            WORK_DIR="Games/PreparedGame"
            mkdir -p "$WORK_DIR"
            
            FILE_URL="$CLEAN_TUNNEL_URL/$ENCODED_TARGET"
            echo "Fetching archive from local server using aria2: $FILE_URL"
            
            # aria2c options:
            # -c: Resume download if partial file exists
            # -s16 / --max-connection-per-server: Use up to 16 connections for speed
            aria2c -c -s16 -j16 --min-split-size=1M "$FILE_URL" -d "$WORK_DIR" -o "game_download.archive"
            
            echo "Extracting archive..."
            7z x "$WORK_DIR/game_download.archive" -o"$WORK_DIR/" -y || unzip -q "$WORK_DIR/game_download.archive" -d "$WORK_DIR/"
            rm -f "$WORK_DIR/game_download.archive"
            
            # Flatten any nested directory structures
            find "$WORK_DIR" -mindepth 2 -type f \( -name "*.nsp" -o -name "*.nsz" -o -name "*.xci" \) -exec mv {} "$WORK_DIR/" \;
            
            echo "=== Final contents of $WORK_DIR ==="
            ls -la "$WORK_DIR"
          else
            # Recursive folder download via wget for uncompressed folders
            WORK_DIR="Games/$RAW_TARGET"
            mkdir -p "$WORK_DIR"
            
            FOLDER_URL="$CLEAN_TUNNEL_URL/$ENCODED_TARGET/"
            echo "Recursively downloading folder from local server: $FOLDER_URL"
            
            wget -r -np -nH --cut-dirs=1 --reject "index.html*" -P "$WORK_DIR" "$FOLDER_URL"
            find "$WORK_DIR" -name "index.html*" -delete
            
            find "$WORK_DIR" -mindepth 2 -type f \( -name "*.nsp" -o -name "*.nsz" -o -name "*.xci" \) -exec mv {} "$WORK_DIR/" \;
            
            echo "=== Final contents of $WORK_DIR ==="
            ls -la "$WORK_DIR"
          fi

      - name: Cache Compiled iOS Shaders
        uses: actions/cache@v4
        with:
          path: Games/PreparedGame/*_build/shader/ios/
          key: nxnative-shaders-${{ github.event.inputs.game_target }}-${{ hashFiles('Games/PreparedGame/**/*.nsp', 'Games/PreparedGame/**/*.xci') }}
          restore-keys: |
            nxnative-shaders-${{ github.event.inputs.game_target }}-
            nxnative-shaders-

      - name: Run Build Script
        run: |
          echo "Patching Launcher.swift compatibility error..."
          find dm/ios/Sources -name "Launcher.swift" -exec sed -i '' 's/glassProminent/automatic/g' {} +
          
          echo "Running build script on prepared directory..."
          python3 scripts/build_ipa_from_nsp.py Games/PreparedGame -k ~/.switch/prod.keys

      - name: Upload Generated Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-nxnative-output
          retention-days: 7
          path: |
            Games/**/*.ipa
            Games/**/*.json
            Games/**/*.zip
